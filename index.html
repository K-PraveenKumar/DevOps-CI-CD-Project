<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps CI/CD Project</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        .status {
            margin-top: 20px;
            padding: 10px 20px;
            border-radius: 6px;
            background: #e8f5e9;
            color: #2e7d32;
            display: inline-block;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>DevOps CI/CD Project</h1>

        <p>
            Application successfully deployed using
            Docker, Jenkins, Terraform and AWS.
        </p>

        <div class="status">
            Container is running successfully
        </div>
    </div>

</body>
</html>
